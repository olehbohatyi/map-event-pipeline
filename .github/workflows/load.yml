name: Load test

# Run by hand (Actions → Load test → Run workflow): builds the stack, runs a Gatling profile against it and keeps the
# HTML report. Not on every push: a runner's numbers vary too much to gate a merge on latency.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "LOAD_PROFILE (smoke, baseline, stress)"
        default: smoke
        required: true

jobs:
  gatling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 27
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Start the stack
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=load-test/' .env
          docker compose up -d --build
          for i in $(seq 1 90); do curl -sf localhost:8080/api/v1/health && break; sleep 2; done
      - name: Gatling
        run: sbt -batch --server load/run
        env:
          LOAD_PROFILE: ${{ inputs.profile }}
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatling-report
          path: target/gatling
      - name: Stop the stack
        if: always()
        run: docker compose down -v
