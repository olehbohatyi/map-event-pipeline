name: Load test

# Run by hand (Actions → Load test → Run workflow): builds the stack, runs a Gatling profile against it and keeps the
# HTML report. Not on every push: a runner's numbers vary too much to gate a merge on latency.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "LOAD_PROFILE (smoke, baseline, stress)"
        default: smoke
        required: true

permissions:
  contents: read

jobs:
  gatling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 27
          cache: sbt
      - uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15
      - name: Start the stack
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=load-test/' .env
          # All of Gatling's traffic comes from one address, which the gate's per-client limit would stop
          sed -i 's/^GATE_RATE_LIMIT_REQUESTS=.*/GATE_RATE_LIMIT_REQUESTS=0/' .env
          docker compose up -d --build
          for i in $(seq 1 90); do curl -sf localhost:8080/api/v1/health && break; sleep 2; done
          curl -sf localhost:8080/api/v1/health || { echo "gate never became healthy"; docker compose logs; exit 1; }
      - name: Gatling
        # The key behind .env's local GATE_API_KEYS entry
        run: MEP_API_KEY=$(sed -n 's/^MEP_API_KEY=//p' .env) sbt -batch --server load/run
        env:
          LOAD_PROFILE: ${{ inputs.profile }}
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gatling-report
          path: target/gatling
      - name: Stop the stack
        if: always()
        run: docker compose down -v
