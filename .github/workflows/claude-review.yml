name: Claude Review

# Automatic code review when a pull request is opened (or leaves draft).
# Later pushes are not re-reviewed; mention @claude on the PR for another pass.

on:
  pull_request:
    types: [opened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts and PRs from forks (secrets are not available to them)
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so the diff against the base branch can be computed
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE BRANCH: ${{ github.base_ref }}

            Review this pull request. The PR branch is checked out in the working directory.
            Read CLAUDE.md first: it lists the project's conventions and constraints, and the
            review should hold the change to them.

            Review ONLY what this PR changes. Get the change with `gh pr diff ${{ github.event.pull_request.number }}`
            (or `git diff origin/${{ github.base_ref }}...HEAD`): lines starting with `+` are added by
            the PR, lines starting with `-` are removed by it. Never treat a removed line as the
            PR's content, and check a claim against the diff direction before reporting it. Files
            in the working directory show the state AFTER the PR, so before saying the PR drops or
            lacks something, confirm it with Read that the PR's version really omits it.

            Focus on, in this order:
            - Correctness: bugs, broken invariants, error handling, resource safety in ZIO
              (scoping, blocking calls, unbounded retries), Kafka delivery semantics
              (offsets committed only after handling, idempotent writes).
            - The repo's constraints from CLAUDE.md, e.g. separate Redis keyspaces for gate and
              pipe, stat staying on Scala 3.7.4 / Java 21 with the DataFrame API only, versions
              changed in both project/Dependencies.scala and build.mill.
            - Tests: every bug fix needs a regression test; integration behaviour belongs in it/.
            - Security and performance issues that matter for this change.

            Do not comment on formatting (scalafmt runs in CI) or compiler warnings
            (-Werror fails the build). Skip praise and restating the diff.

            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) for
            issues tied to specific lines, and `gh pr comment` for one short summary. If you find
            nothing worth changing, say so in one line.
          claude_args: |
            --model claude-sonnet-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Read,Grep,Glob"
