name: Scala Steward

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # To dispatch CI on its pull requests
  actions: write

jobs:
  scala-steward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 27
      - uses: sbt/setup-sbt@v1
      - uses: scala-steward-org/scala-steward-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # A pull request opened or updated with GITHUB_TOKEN gets a CI run that waits for approval and never starts a
      # job. GITHUB_TOKEN may still dispatch a workflow; the run's checks land on the head commit, so the PR shows them.
      # Each head commit is dispatched once, so a rerun of this workflow does not repeat CI.
      - name: Run CI on Scala Steward's pull requests
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr list --author app/github-actions --state open --json headRefName,headRefOid \
            --jq '.[] | select(.headRefName | startswith("update/")) | "\(.headRefName) \(.headRefOid)"' |
          while read -r branch sha; do
            runs=$(gh run list --workflow ci.yml --event workflow_dispatch --commit "$sha" --json databaseId --jq length)
            if [ "$runs" = 0 ]; then
              echo "CI on $branch ($sha)"
              # A branch made before ci.yml could be dispatched cannot be; Steward rebases it on its next run
              gh workflow run ci.yml --ref "$branch" || echo "::warning::could not start CI on $branch"
            fi
          done
