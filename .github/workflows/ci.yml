name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 27 builds and runs the apps; 21 runs the Spark tests (Spark 4.x does not run on 24+)
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            27
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Format, compile, unit tests
        run: sbt -batch --server check
        env:
          SPARK_JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
      - name: Integration tests (Testcontainers)
        run: sbt -batch --server itTest

  mill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 27
      - name: Compile and unit tests
        run: ./mill --no-server __.compile + core.test + gate.test + pipe.test + stat.test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build images
        run: |
          cp .env.example .env
          docker compose --profile stat build

  # The Helm chart on a kind cluster: install with in-cluster Postgres, Redis and Kafka, then post an event and wait
  # until the pipe has stored it
  k8s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build images
        run: |
          docker build --target gate -t map-event-gate:latest .
          docker build --target pipe -t map-event-pipe:latest .
      - uses: helm/kind-action@v1
        with:
          cluster_name: mep
      - name: Load images and install the chart
        run: |
          kind load docker-image map-event-gate:latest map-event-pipe:latest --name mep
          helm lint deploy/helm/map-event-pipeline --set postgres.password=ci
          helm install mep deploy/helm/map-event-pipeline --set postgres.password=ci --wait --timeout 10m
      - name: Smoke test
        run: scripts/k8s-smoke.sh mep
      - name: Show the cluster on failure
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe pods | tail -100
          kubectl logs deploy/mep-gate --all-containers --tail=100 || true
          kubectl logs deploy/mep-pipe --all-containers --tail=100 || true
