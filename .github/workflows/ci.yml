name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 27 builds and runs the apps; 21 runs the Spark tests (Spark 4.x does not run on 24+)
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            27
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Format, compile, unit tests
        run: sbt -batch check
        env:
          SPARK_JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
      - name: Integration tests (Testcontainers)
        run: sbt -batch itTest

  mill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 27
      - name: Compile and unit tests
        run: ./mill --no-server __.compile + core.test + gate.test + pipe.test + stat.test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build images
        run: |
          cp .env.example .env
          docker compose --profile stat build
