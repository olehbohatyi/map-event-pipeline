name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Scala Steward's workflow dispatches this for its pull requests (see scala-steward.yml)
  workflow_dispatch:

# Jobs get a read-only token unless they ask for more
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A dispatched run's checks are on the commit but not in a pull request's checks, so it reports itself as a commit
  # status, which the pull request does show: pending now, the result in `status` below
  started:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Report the run as pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}"
          -f state=pending -f context="CI (dispatched)" -f description="builds, scans, k8s: running"
          -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  sbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 27 builds and runs the apps; 21 runs the Spark tests (Spark 4.x does not run on 24+)
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: |
            21
            27
          cache: sbt
      - uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15
      - name: Format, compile, unit tests
        run: sbt -batch --server check
        env:
          SPARK_JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
      - name: Integration tests (Testcontainers)
        run: sbt -batch --server itTest

  mill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 27
      - name: Compile and unit tests
        run: ./mill --no-server __.compile + core.test + gate.test + pipe.test + stat.test

  # The build's resolved dependencies go to GitHub's dependency graph (Dependabot alerts read it). sbt has no manifest
  # GitHub can parse, so the graph comes from sbt itself. A job of its own: sbt 2 hands commands to a running server,
  # and one started by an earlier step lacks the GITHUB_TOKEN the submission needs.
  dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 27
          cache: sbt
      - uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15
      - uses: scalacenter/sbt-dependency-submission@d84eef4c09e633bcf5f113bcad7fd5e9af1baee9 # v3.2.3

  # Fails a change that adds a dependency with a known high or critical vulnerability. The snapshot above is filed
  # under GITHUB_SHA, which for a pull request is its merge commit, not its head, so that is the commit compared. A
  # dispatched run (Scala Steward's pull requests) has no pull request, so it compares the commit with main.
  dependency-review:
    if: ${{ github.event_name != 'push' }}
    needs: dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          # The snapshot from `dependencies` can take a moment to be processed
          retry-on-snapshot-warnings: true
          base-ref: ${{ github.event.pull_request.base.sha || 'main' }}
          head-ref: ${{ github.sha }}

  # Builds the images, keeps a CycloneDX SBOM of each as a run artifact and scans it with grype; every finding goes to
  # the repository's code scanning alerts. A critical vulnerability with a fix available fails the gate or pipe image;
  # the stat image is Apache's Spark image, whose OS packages are theirs to update, so its scan only reports.
  docker:
    name: docker (${{ matrix.image }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: map-event-gate
            fail: true
          - image: map-event-pipe
            fail: true
          - image: map-event-stat
            fail: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        run: |
          cp .env.example .env
          service=${{ matrix.image }}
          docker compose --profile stat build "${service#map-event-}"
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ matrix.image }}:latest
          format: cyclonedx-json
          output-file: ${{ matrix.image }}.cdx.json
          artifact-name: ${{ matrix.image }}.cdx.json
          upload-release-assets: false
      - name: Scan
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: ${{ matrix.image }}.cdx.json
          only-fixed: true
          severity-cutoff: critical
          fail-build: ${{ matrix.fail }}
          cache-db: true
      - name: Report to code scanning
        if: ${{ !cancelled() && steps.scan.outputs.sarif != '' }}
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: ${{ matrix.image }}

  # The Helm chart on a kind cluster: install with in-cluster Postgres, Redis and Kafka, then post an event and wait
  # until the pipe has stored it
  k8s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build images
        run: |
          docker build --target gate -t map-event-gate:latest .
          docker build --target pipe -t map-event-pipe:latest .
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: mep
      - name: Load images and install the chart
        run: |
          kind load docker-image map-event-gate:latest map-event-pipe:latest --name mep
          # The hash of the smoke test's key, ci-smoke-key
          keys=ci:bbddd8afc9718d7462570c5923f7533c1eba3b35e8c8e820ab31857416ec01ad
          helm lint deploy/helm/map-event-pipeline --set postgres.password=ci --set gate.auth.keys=$keys
          helm install mep deploy/helm/map-event-pipeline --set postgres.password=ci --set gate.auth.keys=$keys \
            --wait --timeout 10m
      - name: Smoke test
        run: scripts/k8s-smoke.sh mep
        env:
          MEP_API_KEY: ci-smoke-key
      - name: Show the cluster on failure
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe pods | tail -100
          kubectl logs deploy/mep-gate --all-containers --tail=100 || true
          kubectl logs deploy/mep-pipe --all-containers --tail=100 || true

  status:
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    needs: [sbt, mill, dependencies, dependency-review, docker, k8s]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Report the result
        env:
          GH_TOKEN: ${{ github.token }}
          # A cancelled job (a newer run on the branch) is an error, not a failure of the change
          STATE: ${{ contains(needs.*.result, 'failure') && 'failure' || (contains(needs.*.result, 'cancelled') && 'error' || 'success') }}
        run: >-
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}"
          -f state="$STATE" -f context="CI (dispatched)" -f description="builds, scans, k8s: $STATE"
          -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
