<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Road events — live map</title>
  <!-- Leaflet and the OpenStreetMap tiles load from the internet; the gate serves only this page and the API -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <style>
    html, body, #map { height: 100%; margin: 0; }
    body { font: 14px/1.4 system-ui, sans-serif; }
    .panel { background: #fff; padding: 8px 10px; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
    .status::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
                      margin-right: 6px; background: var(--dot, #999); }
    .status.live { --dot: #2e7d32; }
    .status.down { --dot: #c62828; }
    .legend span { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin: 0 4px 0 8px; }
    .popup b { display: block; }
    .popup small { color: #555; }
  </style>
</head>
<body>
<div id="map"></div>
<script>
  "use strict";

  const colours = { Low: "#2e7d32", Medium: "#f9a825", High: "#ef6c00", Critical: "#c62828" };
  const radius  = { Low: 5, Medium: 7, High: 9, Critical: 11 };
  const MaxMarkers = 1000;

  const map = L.map("map").setView([48.6, 31.2], 6);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  // Status and counter, top right
  const info = L.control({ position: "topright" });
  info.onAdd = () => {
    const div = L.DomUtil.create("div", "panel");
    div.innerHTML = '<div class="status" id="status">connecting…</div><div id="count">0 events</div>';
    return div;
  };
  info.addTo(map);

  // Severity legend, bottom left
  const legend = L.control({ position: "bottomleft" });
  legend.onAdd = () => {
    const div = L.DomUtil.create("div", "panel legend");
    div.innerHTML = Object.entries(colours).map(([s, c]) => `<span style="background:${c}"></span>${s}`).join("");
    return div;
  };
  legend.addTo(map);

  // Markers by event id: the stream may deliver an event twice, and an event from the initial load may arrive again
  const markers = new Map();

  // Built with textContent, never innerHTML: description is user input
  function popup(e) {
    const div = document.createElement("div");
    div.className = "popup";
    const title = document.createElement("b");
    title.textContent = `${e.eventType} · ${e.severity}`;
    const where = document.createElement("div");
    where.textContent = e.region ?? "unknown region";
    div.append(title, where);
    if (e.description) {
      const text = document.createElement("div");
      text.textContent = e.description;
      div.append(text);
    }
    const when = document.createElement("small");
    when.textContent = new Date(e.occurredAt).toLocaleString();
    div.append(when);
    return div;
  }

  function show(e, fresh) {
    const old = markers.get(e.id);
    if (old) old.remove();
    const marker = L.circleMarker([e.location.lat, e.location.lon], {
      radius: radius[e.severity] ?? 6,
      color: colours[e.severity] ?? "#555",
      fillOpacity: 0.7,
      weight: fresh ? 3 : 1
    }).bindPopup(() => popup(e)).addTo(map);
    markers.delete(e.id);
    markers.set(e.id, marker);
    // Map keeps insertion order, so the first entry is the oldest
    while (markers.size > MaxMarkers) {
      const [id, m] = markers.entries().next().value;
      m.remove();
      markers.delete(id);
    }
    document.getElementById("count").textContent = `${markers.size} events`;
  }

  function status(text, cls) {
    const el = document.getElementById("status");
    el.textContent = text;
    el.className = `status ${cls}`;
  }

  // Latest stored events first (oldest of them drawn first), then everything new as it happens
  fetch("/api/v1/events/recent?limit=200")
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(body => body.events.reverse().forEach(e => show(e, false)))
    .catch(err => console.warn("initial load failed", err))
    .finally(() => {
      const source = new EventSource("/api/v1/events/live");
      source.onopen = () => status("live", "live");
      // EventSource reconnects by itself, e.g. after a gate restart
      source.onerror = () => status("reconnecting…", "down");
      source.addEventListener("event", msg => show(JSON.parse(msg.data), true));
    });
</script>
</body>
</html>
