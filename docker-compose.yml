# map-event-pipeline — infrastructure + applications
#
#   cp .env.example .env              # once; pick the broker in COMPOSE_PROFILES
#   docker compose up -d --build      # postgres, redis, broker, gate, pipe, lgtm (Grafana on :3000)
#   docker compose run --rm stat      # Spark aggregation job (profile: stat)
#   docker compose --profile stat up -d trends   # Spark streaming job: hourly counts (profile: stat)
#
# Both brokers answer to the network alias `broker`, so the apps need no
# per-profile settings. From the host use localhost:${KAFKA_PORT} / ${REDPANDA_PORT}.

x-app-env: &app-env
  POSTGRES_URL:            "jdbc:postgresql://postgres:5432/${POSTGRES_DB}"
  POSTGRES_USER:           ${POSTGRES_USER}
  POSTGRES_PASSWORD:       ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  REDIS_HOST:              redis
  REDIS_PORT:              "6379"
  KAFKA_BOOTSTRAP_SERVERS: broker:9092
  # Traces, metrics and logs to the lgtm service (standard OpenTelemetry SDK variables)
  OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_METRIC_EXPORT_INTERVAL: "10000"

x-broker-deps: &broker-deps
  kafka:
    condition: service_healthy
    required: false
  redpanda:
    condition: service_healthy
    required: false

services:

  # ── Always-on infrastructure ──────────────────────────────────────────────

  # OpenTelemetry collector + Tempo (traces), Prometheus (metrics), Loki (logs) and Grafana in one container.
  # Grafana: http://localhost:${GRAFANA_PORT:-3000} (anonymous admin), with the Map Event Pipeline dashboard.
  # OTLP is published too, so apps started from sbt can export to it. Pinned by digest, like postgis.
  lgtm:
    image: grafana/otel-lgtm:0.38.1@sha256:0df9bc14142000b161344bd24caf6ddd319b7319055aedaf9b0692b125730af7
    container_name: mep-lgtm
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - ./observability/grafana-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/mep.yaml:ro
      - ./observability/map-event-pipeline.json:/otel-lgtm/mep-dashboards/map-event-pipeline.json:ro

  postgres:
    # PostgreSQL 18 with PostGIS 3.6: nearby queries and the region polygons need it.
    # Pinned by digest (PostgreSQL 18.6, PostGIS 3.6.4): upstream publishes no patch-level tag, so the tag alone
    # would change under us. To update, pull the tag, copy the new digest here and into it/.../Containers.scala.
    image: postgis/postgis:18-3.6-alpine@sha256:c53a483fc274072dfa02cd491efa79f3c8ae0a10774a0ece6c9c53b6a632cdef
    container_name: mep-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.6.3-alpine3.23
    container_name: mep-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Profile: kafka ─────────────────────────────────────────────────────────
  # Apache Kafka in KRaft mode (no ZooKeeper)

  kafka:
    image: apache/kafka:4.3.0
    container_name: mep-kafka
    profiles: [kafka]
    restart: unless-stopped
    networks:
      default:
        aliases: [broker]
    ports:
      - "${KAFKA_PORT}:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker:9092,EXTERNAL://localhost:${KAFKA_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Topics are created by the apps (TopicBootstrap) with explicit partitions and retention
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qg
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Profile: redpanda ──────────────────────────────────────────────────────

  redpanda:
    image: redpandadata/redpanda:v26.1.9
    container_name: mep-redpanda
    profiles: [redpanda]
    restart: unless-stopped
    networks:
      default:
        aliases: [broker]
    command:
      - redpanda
      - start
      - --mode dev-container
      - --smp 1
      - --memory 512M
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://broker:9092,external://localhost:${REDPANDA_PORT}
      - --set redpanda.auto_create_topics_enabled=false
    ports:
      - "${REDPANDA_PORT}:19092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  redpanda-console:
    image: redpandadata/console:v2.8.13
    container_name: mep-redpanda-console
    profiles: [redpanda]
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "${REDPANDA_CONSOLE_PORT}:8080"
    environment:
      CONFIG_FILEPATH: /etc/redpanda-console/config.yaml
    volumes:
      - ./redpanda-console-config.yaml:/etc/redpanda-console/config.yaml:ro

  # ── Applications ──────────────────────────────────────────────────────────

  gate:
    build:
      context: .
      target: gate
    image: map-event-gate:latest
    container_name: mep-gate
    restart: unless-stopped
    depends_on:
      <<: *broker-deps
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${GATE_PORT}:8080"
    environment:
      <<: *app-env
      GATE_HOST: 0.0.0.0
      GATE_PORT: "8080"

  pipe:
    build:
      context: .
      target: pipe
    image: map-event-pipe:latest
    container_name: mep-pipe
    restart: unless-stopped
    depends_on:
      <<: *broker-deps
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-env

  # Streaming job: keeps map_event_trends (hourly counts per region and type) up to date from map.events.enriched.
  # The gate and pipe create the topics and run the migrations; until both exist the job fails and is restarted.
  trends:
    build:
      context: .
      target: stat
    image: map-event-stat:latest
    container_name: mep-trends
    profiles: [stat]
    restart: unless-stopped
    command: ["--class", "com.github.olehbohatyi.mep.stat.TrendsApp", "/opt/mep/stat.jar"]
    depends_on:
      <<: *broker-deps
      postgres:
        condition: service_healthy
      pipe:
        condition: service_started
    environment:
      <<: *app-env
      TRENDS_CHECKPOINT_DIR: /var/lib/mep/trends
    volumes:
      # Kafka offsets and de-duplication state: without it a restart would count the retained history again
      - trends_checkpoint:/var/lib/mep/trends

  # One-shot batch job: docker compose run --rm stat
  stat:
    build:
      context: .
      target: stat
    image: map-event-stat:latest
    container_name: mep-stat
    profiles: [stat]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env

volumes:
  trends_checkpoint:
  postgres_data:
  redis_data:
  kafka_data:
  redpanda_data:
