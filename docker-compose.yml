# map-event-pipeline — infrastructure + applications
#
#   cp .env.example .env              # once; pick the broker in COMPOSE_PROFILES
#   docker compose up -d --build      # postgres, redis, broker, gate, pipe
#   docker compose run --rm stat      # Spark aggregation job (profile: stat)
#
# Both brokers answer to the network alias `broker`, so the apps need no
# per-profile settings. From the host use localhost:${KAFKA_PORT} / ${REDPANDA_PORT}.

x-app-env: &app-env
  POSTGRES_URL:            "jdbc:postgresql://postgres:5432/${POSTGRES_DB}"
  POSTGRES_USER:           ${POSTGRES_USER}
  POSTGRES_PASSWORD:       ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  REDIS_HOST:              redis
  REDIS_PORT:              "6379"
  KAFKA_BOOTSTRAP_SERVERS: broker:9092

x-broker-deps: &broker-deps
  kafka:
    condition: service_healthy
    required: false
  redpanda:
    condition: service_healthy
    required: false

services:

  # ── Always-on infrastructure ──────────────────────────────────────────────

  postgres:
    image: postgres:18.4-alpine3.23
    container_name: mep-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.6.3-alpine3.23
    container_name: mep-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Profile: kafka ─────────────────────────────────────────────────────────
  # Apache Kafka in KRaft mode (no ZooKeeper)

  kafka:
    image: apache/kafka:4.3.0
    container_name: mep-kafka
    profiles: [kafka]
    restart: unless-stopped
    networks:
      default:
        aliases: [broker]
    ports:
      - "${KAFKA_PORT}:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker:9092,EXTERNAL://localhost:${KAFKA_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qg
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Profile: redpanda ──────────────────────────────────────────────────────

  redpanda:
    image: redpandadata/redpanda:v26.1.9
    container_name: mep-redpanda
    profiles: [redpanda]
    restart: unless-stopped
    networks:
      default:
        aliases: [broker]
    command:
      - redpanda
      - start
      - --mode dev-container
      - --smp 1
      - --memory 512M
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://broker:9092,external://localhost:${REDPANDA_PORT}
    ports:
      - "${REDPANDA_PORT}:19092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  redpanda-console:
    image: redpandadata/console:v2.8.13
    container_name: mep-redpanda-console
    profiles: [redpanda]
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "${REDPANDA_CONSOLE_PORT}:8080"
    environment:
      CONFIG_FILEPATH: /etc/redpanda-console/config.yaml
    volumes:
      - ./redpanda-console-config.yaml:/etc/redpanda-console/config.yaml:ro

  # ── Applications ──────────────────────────────────────────────────────────

  gate:
    build:
      context: .
      target: gate
    image: map-event-gate:latest
    container_name: mep-gate
    restart: unless-stopped
    depends_on:
      <<: *broker-deps
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${GATE_PORT}:8080"
    environment:
      <<: *app-env
      GATE_HOST: 0.0.0.0
      GATE_PORT: "8080"

  pipe:
    build:
      context: .
      target: pipe
    image: map-event-pipe:latest
    container_name: mep-pipe
    restart: unless-stopped
    depends_on:
      <<: *broker-deps
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-env

  # One-shot batch job: docker compose run --rm stat
  stat:
    build:
      context: .
      target: stat
    image: map-event-stat:latest
    container_name: mep-stat
    profiles: [stat]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  redpanda_data:
