mep {

  http {
    host = "0.0.0.0"
    host = ${?GATE_HOST}
    port = 8080
    port = ${?GATE_PORT}
    # Event submissions per client address and window (fixed windows, counted in Redis); 0 turns the limit off
    rate-limit {
      requests       = 600
      requests       = ${?GATE_RATE_LIMIT_REQUESTS}
      window-seconds = 60
      window-seconds = ${?GATE_RATE_LIMIT_WINDOW_SECONDS}
    }
  }

  kafka {
    bootstrap-servers = "localhost:9092"
    bootstrap-servers = ${?KAFKA_BOOTSTRAP_SERVERS}
    consumer-group    = "mep-pipe"
    # How long a publish may wait for the broker before it fails
    delivery-timeout  = 10 seconds
    delivery-timeout  = ${?KAFKA_DELIVERY_TIMEOUT}
    topics {
      raw      = "map.events.raw"
      enriched = "map.events.enriched"
      hazards  = "map.events.hazards"
      signs    = "map.events.signs"
      traffic  = "map.events.traffic"
      dlq      = "map.events.dlq"
      status   = "map.events.status"
      closed   = "map.events.closed"
    }
    topic-settings {
      partitions          = 3
      replication-factor  = 1
      replication-factor  = ${?KAFKA_REPLICATION_FACTOR}
      retention-hours     = 168 # 7 days
      dlq-retention-hours = 336 # 14 days: time to inspect and replay bad records
    }
  }

  # Open events expire this long after the gate received them; the pipe looks for them every sweep-interval
  lifecycle {
    hazard-ttl     = 6 hours
    hazard-ttl     = ${?EVENT_HAZARD_TTL}
    traffic-ttl    = 2 hours
    traffic-ttl    = ${?EVENT_TRAFFIC_TTL}
    sign-ttl       = 30 days
    sign-ttl       = ${?EVENT_SIGN_TTL}
    sweep-interval = 1 minute
  }

  postgres {
    url      = "jdbc:postgresql://localhost:5432/mapevents"
    url      = ${?POSTGRES_URL}
    user     = "mep"
    user     = ${?POSTGRES_USER}
    password = ""
    password = ${?POSTGRES_PASSWORD}
    max-pool = 10
    # Waiting for a pooled connection, and for one statement: a Postgres that stops answering fails the call
    connect-timeout = 5 seconds
    connect-timeout = ${?POSTGRES_CONNECT_TIMEOUT}
    socket-timeout  = 30 seconds
    socket-timeout  = ${?POSTGRES_SOCKET_TIMEOUT}
  }

  redis {
    host = "localhost"
    host = ${?REDIS_HOST}
    port = 6379
    port = ${?REDIS_PORT}
  }
}
