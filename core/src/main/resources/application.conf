mep {

  http {
    host = "0.0.0.0"
    host = ${?GATE_HOST}
    port = 8080
    port = ${?GATE_PORT}
  }

  kafka {
    bootstrap-servers = "localhost:9092"
    bootstrap-servers = ${?KAFKA_BOOTSTRAP_SERVERS}
    consumer-group    = "mep-pipe"
    topics {
      raw      = "map.events.raw"
      enriched = "map.events.enriched"
      hazards  = "map.events.hazards"
      signs    = "map.events.signs"
      traffic  = "map.events.traffic"
    }
  }

  postgres {
    url      = "jdbc:postgresql://localhost:5432/mapevents"
    url      = ${?POSTGRES_URL}
    user     = "mep"
    user     = ${?POSTGRES_USER}
    password = ""
    password = ${?POSTGRES_PASSWORD}
    max-pool = 10
  }

  redis {
    host = "localhost"
    host = ${?REDIS_HOST}
    port = 6379
    port = ${?REDIS_PORT}
  }
}
