{{- if .Values.lgtm.enabled }}
{{- $n := include "mep.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $n }}-lgtm
  labels: {{- include "mep.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: lgtm, app.kubernetes.io/instance: {{ .Release.Name }}}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: lgtm, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      containers:
        - name: lgtm
          image: {{ .Values.lgtm.image }}
          ports: [{name: grafana, containerPort: 3000}, {name: otlp-http, containerPort: 4318}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $n }}-lgtm
  labels: {{- include "mep.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: lgtm, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: grafana, port: 3000}, {name: otlp-http, port: 4318}]
{{- end }}
