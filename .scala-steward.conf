# Group the ZIO ecosystem into one PR
pullRequests.grouping = [
  { name = "zio", "title" = "build: update ZIO libraries", "filter" = [{"group" = "dev.zio"}] },
  { name = "all", "title" = "build: update dependencies", "filter" = [{"group" = "*"}] }
]

commits.message = "build: update ${artifactName} from ${currentVersion} to ${nextVersion}"

# stat must stay on the Scala 2.13 stdlib that Spark links against (see project/Dependencies.scala);
# its version line carries `scala-steward:off`
